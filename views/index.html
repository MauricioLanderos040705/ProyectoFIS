<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vista previa del Sweater</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            /*background-color: #0B1F3A;*/
            background-image: url('nieve fondo.jpg');
            font-family: Arial, sans-serif;
            text-align: center;
            color: #FFF8E7;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #FF6B6B;
            margin-bottom: 5px;
        }

        h2 {
            font-weight: normal;
            margin-top: 0;
        }
        
        /* Contenedor principal */
        .contenedor { 
            background-color: #000000;
            background-image: url('tapete.jpg');
            background-size: cover;
            border: 3px solid #BB5555;
            border-radius: 15px;
            padding: 25px;
            max-width: 720px;
            margin: 30px auto;
        }

        .editor {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .vista {
            flex: 1 1 260px;
        }

        svg {
            width: 100%;
            max-width: 280px;
        }

        /* Panel de selección de color */
        .panel-color {
            position: relative;
            flex: 0 1 230px;
            border: 3px solid #D4A017;
            border-radius: 12px;
            padding: 28px 15px 15px;
            background-color: #000000;
        }

        .panel-color .etiqueta {
            position: absolute;
            top: -14px;
            left: 12px;
            background-color: #FFF8E7;
            color: #0B1F3A;
            font-weight: bold;
            padding: 3px 12px;
            border-radius: 8px;
        }

        .paleta {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            justify-items: center;
        }

        .color {
            width: 38px;
            height: 38px;
            padding: 0;
            margin: 0;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: transform 0.15s;
        }

        .color:hover {
            transform: scale(1.15);
        }

        .color.activo {
            border: 3px solid #FFFFFF;
            box-shadow: 0 0 0 3px #D4A017;
            transform: scale(1.1);
        }

        .color:focus-visible {
            outline: 3px solid #FFFFFF;
            outline-offset: 2px;
        }

        #resultado {
            margin: 15px 0 5px;
            font-size: 15px;
        }

        .acciones {
            margin-top: 10px;
        }

        .acciones button {
            padding: 12px 18px;
            margin: 6px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .confirmar {
            background-color: #FFF8E7;
            color: #0B1F3A;
        }

        .guardar {
            background-color: #D4A017;
            color: #0B1F3A;
        }

        .acciones button:hover {
            filter: brightness(1.1);
        }

        #mensaje {
            min-height: 22px;
            margin-top: 12px;
            color: #9BE7A5;
        }
    </style>
</head>

<body>
    <h1>🎄 My Ugly Sweater 🎄</h1>
    <h2>Vista previa de tu sweater</h2>

    <div class="contenedor">
        <div class="editor">
            <div class="vista">

                <model-viewer src="sueter.glb"
                    alt="Modelo 3D del sweater"
                    shadow-intensity="0"
                    camera-controls
                    disable-pan
                    style="width: 100%; height: 300px;">
                </model-viewer>
                
                <svg viewBox="0 0 300 300">
                    <path id="sueter" d="M105 45 L75 55 L25 100 L55 155
                            L80 135 L80 255 L220 255 L220 135
                            L245 155 L275 100 L225 55 L195 45
                            Q150 75 105 45 Z" fill="#C62828" stroke="#43251c" stroke-width="5" />
                    <text x="150" y="165" text-anchor="middle" font-size="40">❄</text>
                </svg>

            </div>

            <div class="panel-color">
                <span class="etiqueta">color</span>
                <div class="paleta" id="paleta"></div>
                <h3 id="resultado">Color seleccionado: Rojo</h3>
            </div>
        </div>

        <div class="acciones">
            <button class="confirmar" onclick="confirmarColor()">confirmar color</button>
            <button class="guardar" onclick="guardarSweater()">guardar sweater</button>
        </div>
        
        <div id="mensaje"></div>
    </div>

    <script>
        const colores = [
            { nombre: "Rojo", hex: "#C62828" },
            { nombre: "Rojo oscuro", hex: "#7F1D1D" },
            { nombre: "Rosa", hex: "#F48FB1" },
            { nombre: "Fucsia", hex: "#D81B60" },
            { nombre: "Naranja", hex: "#EF6C00" },
            { nombre: "Dorado", hex: "#D4A017" },
            { nombre: "Amarillo", hex: "#FDD835" },
            { nombre: "Crema", hex: "#FFF3D6" },
            { nombre: "Verde", hex: "#176B3A" },
            { nombre: "Verde lima", hex: "#7CB342" },
            { nombre: "Verde menta", hex: "#80CBC4" },
            { nombre: "Turquesa", hex: "#00897B" },
            { nombre: "Azul cielo", hex: "#4FC3F7" },
            { nombre: "Azul", hex: "#1565C0" },
            { nombre: "Azul marino", hex: "#0D2B5E" },
            { nombre: "Morado", hex: "#6A1B9A" },
            { nombre: "Lavanda", hex: "#B39DDB" },
            { nombre: "Café", hex: "#6D4C41" },
            { nombre: "Gris", hex: "#78909C" },
            { nombre: "Blanco", hex: "#FFFFFF" }
        ];

        let colorElegido = colores[0];
        let colorConfirmado = colores[0];

        const paleta = document.getElementById("paleta");
        const visor = document.querySelector("model-viewer");


        colores.forEach(function (c) {
            const boton = document.createElement("button");
            boton.className = "color";
            boton.style.backgroundColor = c.hex;
            boton.title = c.nombre;
            boton.setAttribute("aria-label", c.nombre);
            boton.onclick = function () { cambiarColor(c, boton); };
            if (c === colorElegido) boton.classList.add("activo");
            paleta.appendChild(boton);
        });

        function cambiarColor(c, boton) {
            colorElegido = c;
            document.getElementById("sueter").style.fill = c.hex;
            aplicarColor(c.hex);
            document.getElementById("resultado").textContent =
                "Color seleccionado: " + c.nombre;
            document.querySelectorAll(".color").forEach(function (b) {
                b.classList.remove("activo");
            });
            boton.classList.add("activo");
            document.getElementById("mensaje").textContent = "";
        }

        function confirmarColor() {
            colorConfirmado = colorElegido;
            document.getElementById("mensaje").textContent =
                "Color confirmado: " + colorConfirmado.nombre;
        }

        function guardarSweater() {
            const sweater = {
                color: colorConfirmado.nombre,
                hex: colorConfirmado.hex
            };
            console.log("Sweater guardado:", sweater);
            document.getElementById("mensaje").textContent =
                "¡Sweater guardado en " + sweater.color + "! 🎁";
        }

        let materialSueter;

        visor.addEventListener("load", function () {
            materialSueter = visor.model.materials.find(
                material => material.name === "Material"
            );

            if (!materialSueter) {
                console.error("No se encontró el material del suéter.");
                document.getElementById("mensaje").textContent =
                    "No se encontró el material del suéter.";
                return;
            }

            aplicarColor(colorElegido.hex);
        });

        visor.addEventListener("error", function () {
            document.getElementById("mensaje").textContent =
                "No se pudo cargar el modelo 3D.";
        });

        function aplicarColor(hex) {
            if (!materialSueter) return;

            const rgb = hex.match(/[0-9a-f]{2}/gi)
                .map(valor => parseInt(valor, 16) / 255);

            materialSueter.pbrMetallicRoughness.setBaseColorFactor([...rgb, 1]);
        }

    </script>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

</body>

</html>
